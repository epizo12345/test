name: Build RimWorld 1.6 Mod

on:
  push:
    branches:
      - rimworld-leather-consolidator-1.6
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Validate XML
        shell: pwsh
        run: |
          $files = @(
            'About/About.xml',
            'Defs/LeatherConsolidatorSettings.xml',
            'Defs/LegacyOptimizationLeathers.xml'
          )
          foreach ($file in $files) {
            try {
              [xml](Get-Content -Raw -Encoding UTF8 $file) | Out-Null
              Write-Host "XML OK: $file"
            }
            catch {
              Write-Error "Invalid XML: $file`n$_"
              exit 1
            }
          }

      - name: Restore
        run: dotnet restore Source/LeatherConsolidator.csproj

      - name: Build
        run: dotnet build Source/LeatherConsolidator.csproj -c Release --no-restore

      - name: Stage mod
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact/LeatherConsolidator/Assemblies | Out-Null
          Copy-Item About artifact/LeatherConsolidator/About -Recurse
          Copy-Item Defs artifact/LeatherConsolidator/Defs -Recurse
          Copy-Item Assemblies/LeatherConsolidator.dll artifact/LeatherConsolidator/Assemblies/LeatherConsolidator.dll
          Copy-Item README.md artifact/LeatherConsolidator/README.md

          $required = @(
            'artifact/LeatherConsolidator/About/About.xml',
            'artifact/LeatherConsolidator/Defs/LeatherConsolidatorSettings.xml',
            'artifact/LeatherConsolidator/Defs/LegacyOptimizationLeathers.xml',
            'artifact/LeatherConsolidator/Assemblies/LeatherConsolidator.dll'
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              Write-Error "Missing staged mod file: $file"
              exit 1
            }
          }

      - name: Upload mod artifact
        uses: actions/upload-artifact@v4
        with:
          name: LeatherConsolidator-RimWorld-1.6
          path: artifact/LeatherConsolidator
          if-no-files-found: error
